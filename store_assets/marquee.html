<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 1400px; height: 560px;
    background: radial-gradient(circle at 75% 30%, #1e293b 0%, #090d16 100%);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    color: #f8fafc;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 60px 100px;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute; width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.25) 0%, rgba(59, 130, 246, 0) 70%);
    top: -100px; right: 100px; pointer-events: none;
  }
  .left {
    max-width: 650px; z-index: 2;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(59, 130, 246, 0.15);
    border: 1px solid rgba(59, 130, 246, 0.35);
    color: #60a5fa;
    padding: 8px 18px; border-radius: 9999px;
    font-size: 14px; font-weight: 700; letter-spacing: 0.5px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 52px; font-weight: 800; line-height: 1.15;
    letter-spacing: -0.5px; margin-bottom: 16px;
    background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  h1 span {
    background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  p {
    font-size: 20px; line-height: 1.5; color: #94a3b8; margin-bottom: 28px;
  }
  .tags {
    display: flex; gap: 12px;
  }
  .tag-item {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 8px 16px; border-radius: 12px;
    font-size: 14px; font-weight: 600; color: #e2e8f0;
  }
  .right {
    z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 28px;
    padding: 40px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 40px rgba(59, 130, 246, 0.2);
    backdrop-filter: blur(16px);
    width: 380px;
    text-align: center;
  }
  .icon-big {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 30px rgba(59, 130, 246, 0.4);
    margin-bottom: 20px;
  }
  .icon-big svg { width: 44px; height: 44px; stroke: white; }
  .box-name { font-size: 26px; font-weight: 800; color: #f8fafc; margin-bottom: 6px; }
  .box-desc { font-size: 14px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="left">
    <div class="badge">⚡ CLEANJOB FILTER</div>
    <h1>Filter Vacancies on <span>OLX & Pracuj.pl</span></h1>
    <p>Smart, lightweight browser extension to instantly remove spam, taxi, and courier ads from job boards.</p>
    <div class="tags">
      <div class="tag-item">🎯 1-Click Hide</div>
      <div class="tag-item">🔍 Custom Keywords</div>
      <div class="tag-item">👀 Reveal Mode</div>
      <div class="tag-item">🔒 100% Private</div>
    </div>
  </div>
  <div class="right">
    <div class="icon-big">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
      </svg>
    </div>
    <div class="box-name">CleanJob Extension</div>
    <div class="box-desc">Optimized for Poland & Ukraine</div>
  </div>
</body>
</html>
