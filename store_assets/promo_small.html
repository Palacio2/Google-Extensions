<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 440px; height: 280px;
    background: radial-gradient(circle at 30% 20%, #1e293b 0%, #0b0f19 100%);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .glow {
    position: absolute; width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.35) 0%, rgba(59, 130, 246, 0) 70%);
    top: -50px; pointer-events: none;
  }
  .icon-box {
    width: 60px; height: 60px;
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
    margin-bottom: 12px;
    z-index: 2;
  }
  .icon-box svg { width: 32px; height: 32px; stroke: white; }
  h1 {
    font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px;
    background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    z-index: 2;
  }
  p {
    font-size: 13px; color: #94a3b8; margin-bottom: 14px; line-height: 1.3;
    z-index: 2;
  }
  .tags {
    display: flex; gap: 6px; z-index: 2;
  }
  .tag {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 4px 10px; border-radius: 6px;
    font-size: 11px; font-weight: 600; color: #cbd5e1;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="icon-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
    </svg>
  </div>
  <h1>CleanJob Filter</h1>
  <p>Smart job ad filter for OLX.pl, OLX.ua & Pracuj.pl</p>
  <div class="tags">
    <span class="tag">⚡ 1-Click Hide</span>
    <span class="tag">🔍 Custom Words</span>
    <span class="tag">🔒 100% Free</span>
  </div>
</body>
</html>
